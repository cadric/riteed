id: io.github.cadric.Riteed
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
command: riteed
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
modules:
  - name: git
    buildsystem: simple
    build-options:
      no-debuginfo: true
    build-commands:
      - command -v gpg >/dev/null
      - export GNUPGHOME="$PWD/gnupg" && mkdir -m 700 "$GNUPGHOME" && gpg --batch --import kernelorg-checksum-autosigner.asc && gpg --batch --verify sha256sums.asc && awk '/  git-2.54.0.tar.xz$/ { print }' sha256sums.asc | sha256sum -c - && rm -rf "$GNUPGHOME"
      - tar -xf git-2.54.0.tar.xz
      - make -C git-2.54.0 prefix=/app NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_PERL=YesPlease NO_PYTHON=YesPlease NO_CURL=YesPlease NO_EXPAT=YesPlease NO_OPENSSL=YesPlease BLK_SHA1=YesPlease INSTALL_SYMLINKS=YesPlease SKIP_DASHED_BUILT_INS=YesPlease all
      - make -C git-2.54.0 prefix=/app NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_PERL=YesPlease NO_PYTHON=YesPlease NO_CURL=YesPlease NO_EXPAT=YesPlease NO_OPENSSL=YesPlease BLK_SHA1=YesPlease INSTALL_SYMLINKS=YesPlease SKIP_DASHED_BUILT_INS=YesPlease install
      - install -Dm644 git-2.54.0/COPYING /app/share/licenses/io.github.cadric.Riteed/git/COPYING
      - install -Dm644 git-2.54.0/LGPL-2.1 /app/share/licenses/io.github.cadric.Riteed/git/LGPL-2.1
      - install -Dm644 git-2.54.0/reftable/LICENSE /app/share/licenses/io.github.cadric.Riteed/git/reftable-LICENSE
      - install -Dm644 git-2.54.0/sha1dc/LICENSE.txt /app/share/licenses/io.github.cadric.Riteed/git/sha1dc-LICENSE.txt
      - rm -f /app/bin/scalar /app/bin/git-shell /app/bin/git-cvsserver /app/bin/git-receive-pack /app/bin/git-upload-pack /app/bin/git-upload-archive /app/libexec/git-core/git /app/libexec/git-core/git-* /app/libexec/git-core/scalar
      - rm -rf /app/libexec/git-core/mergetools /app/share/git-core /app/share/bash-completion /app/share/man /app/share/doc/git*
      - strip --strip-unneeded /app/bin/git
    sources:
      - type: file
        url: https://www.kernel.org/pub/software/scm/git/git-2.54.0.tar.xz
        sha256: f689162364c10de79ef89aa8dbf48731eb057e34edbbd20aca510ce0154681a3
      - type: file
        url: https://www.kernel.org/pub/software/scm/git/sha256sums.asc
        sha256: 71893f99a6b1486875415cf1585fb16f8f7cf07d8313dd4ab82cc144e524fd48
      - type: file
        path: git/kernelorg-checksum-autosigner.asc
  - name: riteed
    buildsystem: simple
    build-commands:
      - cargo --offline --locked build --release
      - msgfmt -o po/da.gmo po/da.po
      - install -Dm755 target/release/riteed /app/bin/riteed
      - install -Dm644 LICENSE /app/share/licenses/io.github.cadric.Riteed/Riteed-MIT.txt
      - install -Dm644 THIRD_PARTY_LICENSES.md /app/share/licenses/io.github.cadric.Riteed/THIRD_PARTY_LICENSES.md
      - install -Dm644 vendor/similar/LICENSE /app/share/licenses/io.github.cadric.Riteed/cargo/similar-Apache-2.0.txt
      - install -Dm644 vendor/pulldown-cmark/LICENSE /app/share/licenses/io.github.cadric.Riteed/cargo/pulldown-cmark-MIT.txt
      - install -Dm644 vendor/unicase/LICENSE-MIT /app/share/licenses/io.github.cadric.Riteed/cargo/unicase-MIT.txt
      - install -Dm644 vendor/unicase/LICENSE-APACHE /app/share/licenses/io.github.cadric.Riteed/cargo/unicase-Apache-2.0.txt
      - install -Dm644 vendor/yaml-rust2/MIT-LICENSE /app/share/licenses/io.github.cadric.Riteed/cargo/yaml-rust2-MIT.txt
      - install -Dm644 vendor/yaml-rust2/Apache-LICENSE /app/share/licenses/io.github.cadric.Riteed/cargo/yaml-rust2-Apache-2.0.txt
      - install -Dm644 vendor/arraydeque/LICENSE /app/share/licenses/io.github.cadric.Riteed/cargo/arraydeque-MIT-Apache-2.0.txt
      - install -Dm644 vendor/hashlink/LICENSE-MIT /app/share/licenses/io.github.cadric.Riteed/cargo/hashlink-MIT.txt
      - install -Dm644 vendor/hashlink/LICENSE-APACHE /app/share/licenses/io.github.cadric.Riteed/cargo/hashlink-Apache-2.0.txt
      - install -Dm644 vendor/hashbrown-0.16.1/LICENSE-MIT /app/share/licenses/io.github.cadric.Riteed/cargo/hashbrown-0.16.1-MIT.txt
      - install -Dm644 vendor/hashbrown-0.16.1/LICENSE-APACHE /app/share/licenses/io.github.cadric.Riteed/cargo/hashbrown-0.16.1-Apache-2.0.txt
      - install -Dm644 vendor/foldhash/LICENSE /app/share/licenses/io.github.cadric.Riteed/cargo/foldhash-Zlib.txt
      - install -Dm644 data/io.github.cadric.Riteed.desktop /app/share/applications/io.github.cadric.Riteed.desktop
      - install -Dm644 data/io.github.cadric.Riteed.metainfo.xml /app/share/metainfo/io.github.cadric.Riteed.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.cadric.Riteed-about.svg /app/share/icons/hicolor/scalable/apps/io.github.cadric.Riteed-about.svg
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.cadric.Riteed.svg /app/share/icons/hicolor/scalable/apps/io.github.cadric.Riteed.svg
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.cadric.Riteed.symbolic.svg /app/share/icons/hicolor/scalable/apps/io.github.cadric.Riteed.symbolic.svg
      - install -Dm644 data/schemas/io.github.cadric.Riteed.gschema.xml /app/share/glib-2.0/schemas/io.github.cadric.Riteed.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas
      - install -Dm644 po/da.gmo /app/share/locale/da/LC_MESSAGES/io.github.cadric.Riteed.mo
    sources:
      - type: dir
        path: ..
      - type: file
        path: ../../LICENSE
      - type: file
        path: ../../THIRD_PARTY_LICENSES.md
