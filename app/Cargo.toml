[package]
name = "riteed"
version = "0.3.4"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
fuzzing = []
stress = []

[dependencies]
gtk4 = { version = "=0.11.2", features = ["v4_10"] }
libadwaita = { version = "=0.9.1", features = ["v1_6"] }
gettext-rs = { version = "=0.7.7", features = ["gettext-system"] }
sourceview5 = { version = "=0.11.0", features = ["v5_4"] }
similar = { version = "=3.1.1", features = ["inline", "unicode"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
yaml-rust2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[build-dependencies]
glib-build-tools = "=0.22.0"

[[bin]]
name = "riteed"
path = "src/main.rs"

[[bin]]
name = "riteed-stress"
path = "src/bin/riteed_stress.rs"
required-features = ["stress"]

[patch.crates-io]
sourceview5 = { path = "build-aux/cargo-patches/sourceview5" }

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unsafe_attr_outside_unsafe = "deny"
missing_unsafe_on_extern = "deny"
ffi_unwind_calls = "deny"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(coverage)'] }
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
