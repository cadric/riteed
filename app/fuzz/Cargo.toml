[package]
name = "riteed-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
riteed = { path = "..", features = ["fuzzing"] }

[patch.crates-io]
pulldown-cmark = { path = "../build-aux/cargo-patches/pulldown-cmark" }
sourceview5 = { path = "../build-aux/cargo-patches/sourceview5" }

[[bin]]
name = "markdown_parse"
path = "fuzz_targets/markdown_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frontmatter_split"
path = "fuzz_targets/frontmatter_split.rs"
test = false
doc = false
bench = false

[[bin]]
name = "git_status_parse"
path = "fuzz_targets/git_status_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diff_compute"
path = "fuzz_targets/diff_compute.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unsupported_scanner"
path = "fuzz_targets/unsupported_scanner.rs"
test = false
doc = false
bench = false

[[bin]]
name = "page_text_decode"
path = "fuzz_targets/page_text_decode.rs"
test = false
doc = false
bench = false
