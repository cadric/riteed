version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:20"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "rust"
    groups:
      app-cargo:
        patterns:
          - "*"
    ignore:
      # Keep GTK bindings coordinated with the GNOME platform and the locked
      # gtk4-sys ABI. Dependabot patch bumps can otherwise compile gtk4 against
      # an older gtk4-sys lockfile, as seen with the 0.11.2/0.11.3 mismatch.
      - dependency-name: "gtk4"
      - dependency-name: "gtk4-sys"

  - package-ecosystem: "cargo"
    directory: "/app/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:40"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "rust"
      - "fuzzing"
    allow:
      # Keep the nested fuzz workspace from editing the app crate's manifest
      # through the local riteed path dependency. App dependency updates belong
      # to /app first, then app/fuzz/Cargo.lock is synced manually when needed.
      - dependency-name: "libfuzzer-sys"
    groups:
      fuzz-cargo:
        patterns:
          - "*"
    ignore:
      # The independent fuzz workspace must not advance GTK bindings ahead of
      # the app workspace. The stress-test report documents a 0.11.2/0.11.3 ABI
      # mismatch that broke cargo-fuzz until both lockfiles were aligned.
      - dependency-name: "gtk4"
      - dependency-name: "gtk4-sys"
