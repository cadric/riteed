name: Publish Flatpak

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Version tag to publish, for example v0.3.6"
        required: false
        type: string
      emergency_rollback:
        description: "Allow publishing a version older than the current beta remote"
        required: false
        default: false
        type: boolean
      rollback_ref:
        description: "Reviewed rollback tag/ref, required when emergency rollback is true"
        required: false
        type: string
      rollback_reason:
        description: "User-visible rollback reason, required when emergency rollback is true"
        required: false
        type: string

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_ID: io.github.cadric.Riteed
  FLATPAK_BRANCH: beta
  FLATPAK_BASE_URL: https://cadric.github.io/riteed/flatpak/
  FLATPAK_REPO_URL: https://cadric.github.io/riteed/flatpak/repo/
  RUNTIME_REPO: https://dl.flathub.org/repo/flathub.flatpakrepo

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_ref: ${{ steps.release.outputs.release_ref }}
      tag_commit: ${{ steps.release.outputs.tag_commit }}
      emergency_rollback: ${{ steps.release.outputs.emergency_rollback }}
      rollback_ref: ${{ steps.release.outputs.rollback_ref }}
      rollback_reason: ${{ steps.release.outputs.rollback_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install remote check tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak
      - name: Validate release tag and metadata
        id: release
        env:
          EMERGENCY_ROLLBACK: ${{ inputs.emergency_rollback || false }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_REF: ${{ inputs.release_ref || '' }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason || '' }}
          ROLLBACK_REF: ${{ inputs.rollback_ref || '' }}
        run: |
          set -euo pipefail

          release_ref="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$REQUESTED_RELEASE_REF" ]]; then
            release_ref="$REQUESTED_RELEASE_REF"
          fi
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Flatpak publish must run from a version tag." >&2
            exit 1
          fi
          if [[ ! "$release_ref" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.+][A-Za-z0-9.-]+)?$ ]]; then
            echo "Flatpak publish target must be a SemVer version tag." >&2
            exit 1
          fi

          git fetch origin "+refs/tags/$release_ref:refs/tags/$release_ref" +refs/heads/main:refs/remotes/origin/main
          version="$(git show "$release_ref:app/Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -n 1)"
          test -n "$version"
          if [[ "$release_ref" != "v$version" ]]; then
            echo "Tag $release_ref does not match app/Cargo.toml version $version." >&2
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$release_ref")"
          git merge-base --is-ancestor "$tag_commit" origin/main

          checks_json="$RUNNER_TEMP/release-check-runs.json"
          CHECK_RUNS_JSON="$checks_json" TAG_COMMIT="$tag_commit" python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          tag_commit = os.environ["TAG_COMMIT"]
          payloads = []
          url = (
              "https://api.github.com/repos/"
              + urllib.parse.quote(repo, safe="/")
              + "/commits/"
              + urllib.parse.quote(tag_commit, safe="")
              + "/check-runs?per_page=100&filter=all"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          while url:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
                  link = response.headers.get("Link", "")
              payloads.append(payload)
              next_url = ""
              for part in link.split(","):
                  if 'rel="next"' not in part:
                      continue
                  start = part.find("<")
                  end = part.find(">", start + 1)
                  if start != -1 and end != -1:
                      next_url = part[start + 1 : end]
              url = next_url
          with open(os.environ["CHECK_RUNS_JSON"], "w", encoding="utf-8") as output:
              json.dump(payloads, output)
          PY
          if [[ "$ROLLBACK_REASON" == *$'\n'* || "$ROLLBACK_REF" == *$'\n'* ]]; then
            echo "Rollback inputs must be single-line values." >&2
            exit 1
          fi
          if [[ "${EMERGENCY_ROLLBACK,,}" == "true" ]]; then
            if [[ -z "$ROLLBACK_REF" || -z "$ROLLBACK_REASON" ]]; then
              echo "emergency_rollback requires rollback_ref and rollback_reason." >&2
              exit 1
            fi
          fi

          VERSION="$version" python3 - <<'PY'
          import datetime as dt
          import os
          import sys
          import xml.etree.ElementTree as ET
          from zoneinfo import ZoneInfo

          version = os.environ["VERSION"]
          root = ET.parse("app/data/io.github.cadric.Riteed.metainfo.xml").getroot()
          releases = root.find("releases")
          if releases is None:
              print("AppStream metadata has no <releases> section.", file=sys.stderr)
              sys.exit(1)
          first_release = releases.find("release")
          if first_release is None:
              print("AppStream metadata has no <release> entries.", file=sys.stderr)
              sys.exit(1)
          release_version = first_release.get("version")
          if release_version != version:
              print(
                  f"Top AppStream release {release_version!r} does not match {version!r}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          release_date_text = first_release.get("date")
          try:
              release_date = dt.date.fromisoformat(release_date_text or "")
          except ValueError:
              print(f"Invalid AppStream release date {release_date_text!r}.", file=sys.stderr)
              sys.exit(1)
          today = dt.datetime.now(ZoneInfo("Europe/Copenhagen")).date()
          if release_date > today:
              print(
                  f"AppStream release date {release_date} is after {today}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

          remote_state="$(mktemp -d)"
          cleanup_remote_state() {
            rm -rf "$remote_state"
          }
          trap cleanup_remote_state EXIT
          export XDG_DATA_HOME="$remote_state/data"
          export XDG_CONFIG_HOME="$remote_state/config"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"

          published_metadata="$(python3 - <<'PY'
          import re
          import sys
          import urllib.error
          import urllib.request

          url = "https://cadric.github.io/riteed/flatpak/index.html"
          try:
              text = urllib.request.urlopen(url, timeout=20).read().decode("utf-8", "replace")
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("Published beta metadata page is missing.", file=sys.stderr)
                  sys.exit(1)
              raise
          fields = {
              "version": r"Version:\s*<code>([^<]+)</code>",
              "source_ref": r"Source ref:\s*<code>([^<]+)</code>",
              "source_commit": r"Source commit:\s*<code>([0-9a-fA-F]{40})</code>",
          }
          found = {}
          for name, pattern in fields.items():
              match = re.search(pattern, text, re.MULTILINE)
              if match:
                  found[name] = match.group(1)
          if "version" not in found:
              print("Published beta metadata is malformed; missing version.", file=sys.stderr)
              sys.exit(1)
          if ("source_ref" in found) != ("source_commit" in found):
              print("Published beta metadata is malformed; source ref/commit must appear together.", file=sys.stderr)
              sys.exit(1)
          for name, value in found.items():
              print(f"{name}={value}")
          PY
          )"
          published_version="$(printf '%s\n' "$published_metadata" | awk -F= '$1 == "version" {print $2; exit}')"
          published_source_ref="$(printf '%s\n' "$published_metadata" | awk -F= '$1 == "source_ref" {print $2; exit}')"
          published_source_commit="$(printf '%s\n' "$published_metadata" | awk -F= '$1 == "source_commit" {print tolower($2); exit}')"
          published_commit=""
          if flatpak --user remote-add --if-not-exists --no-gpg-verify riteed-beta "$FLATPAK_REPO_URL"; then
            published_commit="$(flatpak remote-info --user --log riteed-beta "$APP_ID//$FLATPAK_BRANCH" \
              | awk '/Commit:/ {print $2; exit}')"
          fi

          CANDIDATE_VERSION="$version" \
          CANDIDATE_REF="$release_ref" \
          CANDIDATE_COMMIT="$tag_commit" \
          PUBLISHED_VERSION="$published_version" \
          PUBLISHED_SOURCE_REF="$published_source_ref" \
          PUBLISHED_SOURCE_COMMIT="$published_source_commit" \
          python3 - <<'PY'
          import os
          import re
          import sys

          candidate = os.environ["CANDIDATE_VERSION"]
          candidate_ref = os.environ["CANDIDATE_REF"]
          candidate_commit = os.environ["CANDIDATE_COMMIT"].lower()
          published = os.environ.get("PUBLISHED_VERSION", "").strip()
          published_ref = os.environ.get("PUBLISHED_SOURCE_REF", "").strip()
          published_commit = os.environ.get("PUBLISHED_SOURCE_COMMIT", "").strip().lower()
          emergency = os.environ.get("EMERGENCY_ROLLBACK", "").lower() == "true"
          rollback_ref = os.environ.get("ROLLBACK_REF", "").strip()
          rollback_reason = os.environ.get("ROLLBACK_REASON", "").strip()

          def version_key(value: str) -> tuple[int, ...]:
              numbers = [int(part) for part in re.findall(r"\d+", value)]
              return tuple(numbers + [0] * (4 - len(numbers)))

          def emergency_allowed() -> bool:
              return emergency and rollback_ref == candidate_ref and len(rollback_reason) >= 20

          if not published:
              print("Published beta version metadata is required before publishing.", file=sys.stderr)
              sys.exit(1)

          candidate_key = version_key(candidate)
          published_key = version_key(published)
          if candidate_key < published_key:
              if emergency_allowed():
                  sys.exit(0)
              print(
                  f"Candidate version {candidate} is older than published beta {published}.",
                  file=sys.stderr,
              )
              sys.exit(1)

          if candidate_key == published_key:
              if not (published_ref and published_commit):
                  print(
                      "Published beta source metadata is required for same-version publish.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              same_source = published_ref == candidate_ref and published_commit == candidate_commit
              if same_source:
                  if emergency:
                      print("emergency_rollback is only valid for a version/ref rollback.", file=sys.stderr)
                      sys.exit(1)
                  sys.exit(0)
              if emergency_allowed():
                  sys.exit(0)
              print(
                  "Candidate release would overwrite the published beta version from a different ref or commit.",
                  file=sys.stderr,
              )
              sys.exit(1)

          if emergency:
              print("emergency_rollback is only valid for a version/ref rollback.", file=sys.stderr)
              sys.exit(1)
          PY

          if [[ -n "$published_version" ]]; then
            echo "Published beta version: $published_version"
            echo "Published beta commit: ${published_commit:-unknown}"
            echo "Published beta source: ${published_source_ref:-unknown}@${published_source_commit:-unknown}"
          fi

          {
            echo "version=$version"
            echo "release_ref=$release_ref"
            echo "tag_commit=$tag_commit"
            if [[ "${EMERGENCY_ROLLBACK,,}" == "true" ]]; then
              echo "emergency_rollback=true"
              echo "rollback_ref=$ROLLBACK_REF"
              echo "rollback_reason=$ROLLBACK_REASON"
            else
              echo "emergency_rollback=false"
              echo "rollback_ref="
              echo "rollback_reason="
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Require successful Validate checks for release commit
        env:
          CHECK_RUNS_JSON: ${{ runner.temp }}/release-check-runs.json
          TAG_COMMIT: ${{ steps.release.outputs.tag_commit }}
        run: |
          set -euo pipefail
          python3 -m tools.release_check_runs \
            --input "$CHECK_RUNS_JSON" \
            --policy policy/release.policy.json \
            --head-sha "$TAG_COMMIT"

  build:
    runs-on: ubuntu-latest
    needs: preflight
    environment:
      name: ${{ needs.preflight.outputs.emergency_rollback == 'true' && 'flatpak-beta-rollback' || 'flatpak-beta-signing' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_ref }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install Flatpak tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder gnupg gpg-agent
      - name: Build signed Flatpak repository
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_REF: ${{ needs.preflight.outputs.release_ref }}
          TAG_COMMIT: ${{ needs.preflight.outputs.tag_commit }}
          EMERGENCY_ROLLBACK: ${{ needs.preflight.outputs.emergency_rollback }}
          ROLLBACK_REF: ${{ needs.preflight.outputs.rollback_ref }}
          ROLLBACK_REASON: ${{ needs.preflight.outputs.rollback_reason }}
        run: |
          set -euo pipefail

          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          cleanup() {
            gpgconf --homedir "$GNUPGHOME" --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          }
          trap cleanup EXIT

          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          echo allow-preset-passphrase >> "$GNUPGHOME/gpg-agent.conf"
          gpg-connect-agent reloadagent /bye

          PRESET="$(command -v gpg-preset-passphrase || true)"
          if [[ -z "$PRESET" ]]; then
            PRESET="$(find /usr/lib -path '*/gpg-preset-passphrase' -type f -print -quit 2>/dev/null || true)"
          fi
          [ -x "$PRESET" ] || { echo "gpg-preset-passphrase not found" >&2; exit 1; }

          keygrip="$(gpg --batch --with-keygrip --with-colons --list-secret-keys "$FLATPAK_GPG_KEY_ID" | awk -F: '
            /^sec:/ || /^ssb:/ {cap=$12}
            /^grp:/ && cap ~ /s|S/ {print $10; exit}
          ')"
          [ -n "$keygrip" ] || { echo "GPG signing keygrip not found" >&2; exit 1; }
          printf '%s' "$FLATPAK_GPG_PASSPHRASE" | "$PRESET" --preset "$keygrip"

          fingerprint="$(gpg --batch --with-colons --fingerprint "$FLATPAK_GPG_KEY_ID" | awk -F: '/^fpr:/ {print $10; exit}')"
          [ -n "$fingerprint" ] || { echo "GPG fingerprint not found" >&2; exit 1; }
          if [[ "$fingerprint" != "$FLATPAK_GPG_KEY_ID" ]]; then
            echo "FLATPAK_GPG_KEY_ID must be the full fingerprint." >&2
            exit 1
          fi
          committed_key="app/build-aux/flatpak/riteed-beta-public.asc"
          committed_keyring="$GNUPGHOME/committed-public.gpg"
          exported_public="$GNUPGHOME/exported-public.gpg"
          gpg --batch --yes --dearmor --output "$committed_keyring" "$committed_key"
          gpg --batch --export "$FLATPAK_GPG_KEY_ID" > "$exported_public"
          if ! cmp -s "$exported_public" "$committed_keyring"; then
            echo "Imported signing key does not match committed beta public key." >&2
            exit 1
          fi
          printf '%s:6:\n' "$fingerprint" | gpg --batch --import-ownertrust
          gpg_key_base64="$(base64 --wrap=0 "$committed_keyring")"

          rm -rf site
          site_args=(
            --site-dir site
            --base-url "$FLATPAK_BASE_URL"
            --repo-url "$FLATPAK_REPO_URL"
            --gpg-key-base64 "$gpg_key_base64"
            --fingerprint "$FLATPAK_GPG_KEY_ID"
            --version "$VERSION"
            --source-ref "$RELEASE_REF"
            --source-commit "$TAG_COMMIT"
          )
          if [[ "$EMERGENCY_ROLLBACK" == "true" ]]; then
            site_args+=(--rollback-ref "$ROLLBACK_REF" --rollback-reason "$ROLLBACK_REASON")
          fi
          python3 app/build-aux/flatpak/generate_site.py "${site_args[@]}"

          flatpak --user remote-add --if-not-exists flathub "$RUNTIME_REPO"
          flatpak-builder \
            --disable-rofiles-fuse \
            --user \
            --assumeyes \
            --install-deps-from=flathub \
            --default-branch="$FLATPAK_BRANCH" \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" \
            --gpg-homedir="$GNUPGHOME" \
            --repo=site/flatpak/repo \
            --force-clean \
            app/build-dir \
            app/build-aux/io.github.cadric.Riteed.yml

          flatpak build-update-repo \
            --default-branch="$FLATPAK_BRANCH" \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" \
            --gpg-homedir="$GNUPGHOME" \
            --generate-static-deltas \
            site/flatpak/repo

          test -s site/flatpak/repo/summary
          test -s site/flatpak/repo/summary.sig
      - name: Check Pages artifact shape
        run: |
          set -euo pipefail
          if find site -type l -print -quit | grep -q .; then
            echo "Pages artifact contains symlinks." >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          bad = []
          for path in Path("site").rglob("*"):
              if path.is_file() and os.stat(path).st_nlink > 1:
                  bad.append(str(path))
          if bad:
              print("Pages artifact contains hardlinks:", file=sys.stderr)
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
