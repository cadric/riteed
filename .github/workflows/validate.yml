name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 2 1 * *"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  dependency-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run fast dependency preflight
        run: scripts/dependency-preflight --root app

  policy-pack:
    needs: dependency-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate policy-pack contract
        run: python3 -m tools.policy_check --policy-pack-check --strict
      - name: Run root validator tests
        run: python3 -m unittest discover -s tools/tests -v

  native-tests:
    needs: dependency-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull Fedora validation image
        run: timeout 10m docker pull fedora:42
      - name: Validate app subtree
        run: |
          docker run --rm \
            --pull=never \
            --privileged \
            -e GSK_RENDERER=cairo \
            -e G_DEBUG=fatal-criticals \
            -e GTK_A11Y=none \
            -e NO_AT_BRIDGE=1 \
            -e RUST_TEST_THREADS=1 \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:42 \
            bash -lc '
              set -euo pipefail
              run_phase() {
                label="$1"
                limit="$2"
                shift 2
                echo "::group::$label"
                date -u +"phase-start=%Y-%m-%dT%H:%M:%SZ label=$label"
                set +e
                timeout "$limit" "$@"
                status="$?"
                set -e
                date -u +"phase-end=%Y-%m-%dT%H:%M:%SZ label=$label status=$status"
                echo "::endgroup::"
                return "$status"
              }
              run_phase "Install Fedora validation dependencies" 10m dnf install -y \
                appstream \
                clang \
                curl \
                dbus-x11 \
                desktop-file-utils \
                diffutils \
                findutils \
                flatpak-builder \
                gcc \
                gcc-c++ \
                gettext \
                gettext-devel \
                git \
                glib2-devel \
                gtk4-devel \
                gtksourceview5-devel \
                libadwaita-devel \
                llvm \
                make \
                pkgconf-pkg-config \
                python3 \
                xorg-x11-server-Xvfb \
                xz
              rustup_version=1.28.2
              rustup_arch=x86_64-unknown-linux-gnu
              rustup_sha256=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
              run_phase "Download pinned rustup" 6m curl --proto "=https" --tlsv1.2 -sSf \
                --connect-timeout 30 --max-time 300 \
                -o rustup-init \
                "https://static.rust-lang.org/rustup/archive/${rustup_version}/${rustup_arch}/rustup-init"
              echo "${rustup_sha256}  rustup-init" | sha256sum -c -
              chmod +x rustup-init
              run_phase "Install Rust 1.95 validation toolchain" 10m ./rustup-init -y --profile minimal --default-toolchain 1.95.0 \
                --component rustfmt --component clippy --component llvm-tools-preview
              rm rustup-init
              . "$HOME/.cargo/env"
              run_phase "Install cargo-llvm-cov" 10m cargo install cargo-llvm-cov --version 0.8.7 --locked
              run_phase "Install xtr" 10m cargo install xtr --version 0.1.11 --locked
              echo "::group::Start headless display"
              mkdir -p stress/artifacts
              Xvfb :99 -screen 0 1280x1024x24 >stress/artifacts/xvfb.log 2>&1 &
              xvfb_pid=$!
              trap "kill $xvfb_pid" EXIT
              export DISPLAY=:99
              export GDK_BACKEND=x11
              echo "::endgroup::"
              run_phase "Run strict app policy gate" 20m dbus-run-session -- python3 -m tools.policy_check --root app --strict
              run_phase "Run coverage gate" 20m dbus-run-session -- python3 -m tools.coverage_check --root app
              echo "::group::Prepare native stress smoke inputs"
              mkdir -p /tmp/riteed-schemas
              cp -R app/data/schemas/. /tmp/riteed-schemas/
              glib-compile-schemas --strict /tmp/riteed-schemas
              export GSETTINGS_SCHEMA_DIR=/tmp/riteed-schemas
              python3 stress/make_corpus.py
              echo "::endgroup::"
              cd app
              run_phase "Build native stress runner" 10m cargo build --bin riteed-stress --features stress
              run_phase "Run open-save-search stress smoke" 5m dbus-run-session -- env RITEED_STRESS_SCRIPT=../stress/scripts/open-save-search.json ./target/debug/riteed-stress
              echo "::group::Run intentional-failure stress smoke"
              date -u +"phase-start=%Y-%m-%dT%H:%M:%SZ label=Run intentional-failure stress smoke"
              set +e
              timeout 5m dbus-run-session -- env RITEED_STRESS_SCRIPT=../stress/scripts/intentional-failure.json ./target/debug/riteed-stress
              status=$?
              set -e
              date -u +"phase-end=%Y-%m-%dT%H:%M:%SZ label=Run intentional-failure stress smoke status=$status"
              echo "::endgroup::"
              if [ "$status" -eq 0 ]; then
                exit 1
              fi
              if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
                exit "$status"
              fi
            '
      - name: Upload stress artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: riteed-native-stress-artifacts
          if-no-files-found: ignore
          path: |
            stress/artifacts/
            stress/corpus/generated/
            stress/git-repos/generated/
            app/fuzz/artifacts/

  ruleset-governance:
    needs: dependency-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify GitHub ruleset governance
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))
        env:
          GITHUB_TOKEN: ${{ secrets.RULESET_GOVERNANCE_TOKEN }}
        run: python3 -m tools.ruleset_governance_check

  flatpak-tests:
    needs: dependency-preflight
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and smoke Flatpak Git path
        run: |
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --disable-rofiles-fuse --user --assumeyes --install-deps-from=flathub --install --force-clean app/build-dir app/build-aux/io.github.cadric.Riteed.yml
          flatpak run --user --command=/app/bin/git io.github.cadric.Riteed --version
          RITEED_GIT_STRESS_COUNT=10 stress/git-repos/make_repos.sh
          repo="$PWD/stress/git-repos/generated/many-untracked"
          flatpak run --user --filesystem="$PWD/stress/git-repos/generated:rw" --command=/app/bin/git io.github.cadric.Riteed --git-dir="$repo/.git" --work-tree="$repo" status --porcelain=v2 -z >/tmp/riteed-flatpak-git-status.bin
          test -s /tmp/riteed-flatpak-git-status.bin

  flatpak:
    needs: dependency-preflight
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read app version
        id: app-version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6
        with:
          bundle: riteed-${{ steps.app-version.outputs.version }}.flatpak
          manifest-path: app/build-aux/io.github.cadric.Riteed.yml
          cache-key: flatpak-builder-${{ github.sha }}

  stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: flatpak-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run scheduled stress suite
        run: |
          docker run --rm \
            --privileged \
            -e GSK_RENDERER=cairo \
            -e G_DEBUG=fatal-criticals \
            -e GTK_A11Y=none \
            -e NO_AT_BRIDGE=1 \
            -e RUST_TEST_THREADS=1 \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:42 \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                appstream \
                clang \
                curl \
                dbus-x11 \
                desktop-file-utils \
                diffutils \
                findutils \
                flatpak-builder \
                gcc \
                gcc-c++ \
                gettext \
                gettext-devel \
                git \
                glib2-devel \
                gtk4-devel \
                gtksourceview5-devel \
                libadwaita-devel \
                llvm \
                make \
                pkgconf-pkg-config \
                python3 \
                xorg-x11-server-Xvfb \
                xz
              rustup_version=1.28.2
              rustup_arch=x86_64-unknown-linux-gnu
              rustup_sha256=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
              curl --proto "=https" --tlsv1.2 -sSf \
                -o rustup-init \
                "https://static.rust-lang.org/rustup/archive/${rustup_version}/${rustup_arch}/rustup-init"
              echo "${rustup_sha256}  rustup-init" | sha256sum -c -
              chmod +x rustup-init
              ./rustup-init -y --profile minimal --default-toolchain 1.95.0 \
                --component rustfmt --component clippy --component llvm-tools-preview
              rm rustup-init
              . "$HOME/.cargo/env"
              cargo install cargo-llvm-cov --version 0.8.7 --locked
              cargo install xtr --version 0.1.11 --locked
              mkdir -p stress/artifacts
              Xvfb :99 -screen 0 1280x1024x24 >stress/artifacts/xvfb.log 2>&1 &
              xvfb_pid=$!
              trap "kill $xvfb_pid" EXIT
              export DISPLAY=:99
              export GDK_BACKEND=x11
              mkdir -p /tmp/riteed-schemas
              cp -R app/data/schemas/. /tmp/riteed-schemas/
              glib-compile-schemas --strict /tmp/riteed-schemas
              export GSETTINGS_SCHEMA_DIR=/tmp/riteed-schemas
              python3 stress/make_corpus.py
              RITEED_GIT_STRESS_COUNT=100 stress/git-repos/make_repos.sh
              cd app
              cargo test _at_ -- --test-threads=1
              cargo test proptest_ -- --test-threads=1
              dbus-run-session -- cargo test gtk_surfaces_and_editor_flow_work -- --test-threads=1
              cargo build --bin riteed-stress --features stress
              for script in ../stress/scripts/open-save-search.json ../stress/scripts/compare-roundtrip.json ../stress/scripts/markdown-stress.json ../stress/scripts/git-status-stress.json; do
                dbus-run-session -- env RITEED_STRESS_SCRIPT="$script" ./target/debug/riteed-stress
              done
              if [ -d fuzz ]; then
                rustup toolchain install nightly --profile minimal --component rust-src
                cargo install cargo-fuzz --version 0.13.1 --locked
                for target in markdown_parse frontmatter_split git_status_parse diff_compute unsupported_scanner page_text_decode; do
                  (cd fuzz && cargo +nightly fuzz run "$target" -- -max_total_time=1800)
                done
              fi
            '
      - name: Upload stress artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: riteed-scheduled-stress-artifacts
          if-no-files-found: ignore
          path: |
            stress/artifacts/
            stress/corpus/generated/
            stress/git-repos/generated/
            app/fuzz/artifacts/
