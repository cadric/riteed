name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run root validator tests
        run: python3 -m unittest tools.tests.test_policy_check tools.tests.test_coverage_check -v

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate app subtree
        run: |
          docker run --rm \
            --privileged \
            -e GSK_RENDERER=cairo \
            -e GTK_A11Y=none \
            -e NO_AT_BRIDGE=1 \
            -e RUST_TEST_THREADS=1 \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:42 \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                appstream \
                clang \
                curl \
                dbus-x11 \
                desktop-file-utils \
                diffutils \
                findutils \
                flatpak-builder \
                gcc \
                gcc-c++ \
                gettext \
                git \
                glib2-devel \
                gtk4-devel \
                gtksourceview5-devel \
                libadwaita-devel \
                llvm \
                make \
                pkgconf-pkg-config \
                python3 \
                xorg-x11-server-Xvfb \
                xz
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain 1.95.0 \
                  --component rustfmt --component clippy --component llvm-tools-preview
              . "$HOME/.cargo/env"
              cargo install cargo-llvm-cov --locked
              Xvfb :99 -screen 0 1280x1024x24 >/tmp/riteed-xvfb.log 2>&1 &
              xvfb_pid=$!
              trap "kill $xvfb_pid" EXIT
              export DISPLAY=:99
              export GDK_BACKEND=x11
              dbus-run-session -- python3 -m tools.policy_check --root app --strict
              dbus-run-session -- python3 -m tools.coverage_check --root app
            '

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: riteed-0.2.0.flatpak
          manifest-path: app/build-aux/io.github.cadric.Riteed.yml
          cache-key: flatpak-builder-${{ github.sha }}
